<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Moj trening</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" crossorigin>
<link rel="stylesheet" href="style.css">
<script>
// iPhone home-screen app (black-translucent status bar): iOS can report the viewport without the status bar, so the app stopped
// 59 pt above the screen bottom (100%, 100vh and position:fixed bottom:0 all used that short height). Here the app takes the
// real screen height instead; in Safari or wherever the two agree nothing changes.
(function(){
  var d = document.documentElement;
  function fit(){
    var h = window.innerHeight, sa = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (sa && /iP(hone|od)/.test(navigator.userAgent)) {
      var s = window.innerWidth > window.innerHeight ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
      if (s > h && s - h < 120) h = s;
    }
    d.style.setProperty('--app-h', h + 'px');
  }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
})();
</script>
</head>
<body>
<div id="app"></div>
<script src="hash.js"></script>
<script src="data.js"></script>
<script src="seed-history.js"></script>
<script src="media.js"></script>
<script src="pitch.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
