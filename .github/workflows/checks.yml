name: Provjere aplikacije
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Izračuni, povijest i stanje aplikacije
        run: node --test tools/check-*.cjs
      - name: Isporučene vježbe i model opterećenja
        run: node tools/build/check_load.cjs .
      - name: Sintaksa JavaScripta
        run: |
          for file in *.js tools/browser/*.cjs; do node --check "$file"; done
  browser:
    needs: logic
    # Keep native browser dependencies reproducible when ubuntu-latest changes.
    runs-on: ubuntu-24.04
    container:
      # Match tools/browser/package-lock.json; native browser dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host --init
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      MT_TEST_OUTPUT: /tmp/moj-trening-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - run: npm ci --prefix tools/browser --ignore-scripts --no-audit --no-fund
      - name: Cijeli trening i postojeće funkcije
        run: node tools/browser/whole-app.cjs live ${{ matrix.browser }}
      - name: Danas i ekipni dnevnik
        run: node tools/browser/today.cjs ${{ matrix.browser }}
      - name: Serije, početna težina i Napredak
        run: |
          node tools/browser/checklist.cjs ${{ matrix.browser }}
          node tools/browser/checklist.cjs just-mixed ${{ matrix.browser }}
          node tools/browser/starting-load.cjs ${{ matrix.browser }}
          node tools/browser/progress.cjs ${{ matrix.browser }}
          node tools/browser/progress-picker.cjs ${{ matrix.browser }}
      - name: Ispravci iz analize
        run: |
          node tools/browser/storage.cjs ${{ matrix.browser }}
          node tools/browser/field-results.cjs ${{ matrix.browser }}
          node tools/browser/navigation.cjs ${{ matrix.browser }}
          node tools/browser/home-progress.cjs ${{ matrix.browser }}
          node tools/browser/workout.cjs ${{ matrix.browser }}
          node tools/browser/training-load.cjs ${{ matrix.browser }}
          node tools/browser/load-day-rating.cjs ${{ matrix.browser }}
          node tools/browser/offline-bootstrap.cjs ${{ matrix.browser }}
          node tools/browser/exercise-media.cjs ${{ matrix.browser }}
          node tools/browser/workout-reference.cjs ${{ matrix.browser }}
          node tools/browser/body-regions.cjs ${{ matrix.browser }}
          node tools/browser/dashboard-anatomy.cjs ${{ matrix.browser }}
          node tools/browser/structure.cjs ${{ matrix.browser }}
          node tools/browser/cinema.cjs ${{ matrix.browser }}
          node tools/browser/live-exercises.cjs ${{ matrix.browser }}
          node tools/browser/sections.cjs ${{ matrix.browser }}
          node tools/browser/sheet-gesture.cjs ${{ matrix.browser }}
          node tools/browser/chart-motion.cjs ${{ matrix.browser }}
          node tools/browser/prestart-edit.cjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: provjere-${{ matrix.browser }}
          path: ${{ env.MT_TEST_OUTPUT }}
          if-no-files-found: ignore
