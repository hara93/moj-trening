name: Provjere aplikacije
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Izračuni, povijest i stanje aplikacije
        run: node --test tools/check-*.cjs
      - name: Isporučene vježbe i model opterećenja
        if: success() || failure()
        run: node tools/build/check_load.cjs .
      - name: Sintaksa JavaScripta
        if: success() || failure()
        run: |
          for file in *.js tools/browser/*.cjs; do node --check "$file"; done
  browser:
    needs: logic
    # Keep native browser dependencies reproducible when ubuntu-latest changes.
    runs-on: ubuntu-24.04
    container:
      # Match tools/browser/package-lock.json; native browser dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host --init
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      MT_TEST_OUTPUT: /tmp/moj-trening-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - name: Ovisnosti preglednika
        id: deps
        run: npm ci --prefix tools/browser --ignore-scripts --no-audit --no-fund
      # One step per entry of tools/browser/suites.json (tools/check-ci-suites.cjs keeps them equal).
      # Each step runs after an earlier failure, so one red suite does not hide the rest.
      - name: Cijeli trening i postojeće funkcije
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/whole-app.cjs live ${{ matrix.browser }}
      - name: Danas i ekipni dnevnik
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/today.cjs ${{ matrix.browser }}
      - name: Serije
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/checklist.cjs ${{ matrix.browser }}
      - name: Serije, mješovite
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/checklist.cjs just-mixed ${{ matrix.browser }}
      - name: Početna težina
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/starting-load.cjs ${{ matrix.browser }}
      - name: Napredak
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/progress.cjs ${{ matrix.browser }}
      - name: Odabir vježbi u Napretku
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/progress-picker.cjs ${{ matrix.browser }}
      - name: Spremanje i kopije
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/storage.cjs ${{ matrix.browser }}
      - name: Rezultati na terenu
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/field-results.cjs ${{ matrix.browser }}
      - name: Navigacija
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/navigation.cjs ${{ matrix.browser }}
      - name: Napredak na početnoj
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/home-progress.cjs ${{ matrix.browser }}
      - name: Trening
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/workout.cjs ${{ matrix.browser }}
      - name: Opterećenje
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/training-load.cjs ${{ matrix.browser }}
      - name: Ocjena dana
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/load-day-rating.cjs ${{ matrix.browser }}
      - name: Rad bez mreže
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/offline-bootstrap.cjs ${{ matrix.browser }}
      - name: Slike vježbi
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/exercise-media.cjs ${{ matrix.browser }}
      - name: Referentni zasloni treninga
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/workout-reference.cjs ${{ matrix.browser }}
      - name: Regije tijela
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/body-regions.cjs ${{ matrix.browser }}
      - name: Figura na pregledu
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/dashboard-anatomy.cjs ${{ matrix.browser }}
      - name: Struktura
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/structure.cjs ${{ matrix.browser }}
      - name: Player
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/cinema.cjs ${{ matrix.browser }}
      - name: Vremenske serije
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/timed-workout.cjs ${{ matrix.browser }}
      - name: Zvuk i vibracija
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/player-feedback.cjs ${{ matrix.browser }}
      - name: Vježbe u playeru
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/live-exercises.cjs ${{ matrix.browser }}
      - name: Odjeljci
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/sections.cjs ${{ matrix.browser }}
      - name: Povlačenje prozora
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/sheet-gesture.cjs ${{ matrix.browser }}
      - name: Animacija grafova
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/chart-motion.cjs ${{ matrix.browser }}
      - name: Uređivanje prije starta
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/prestart-edit.cjs ${{ matrix.browser }}
      - name: Djelomičan trening
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/partial-session.cjs ${{ matrix.browser }}
      - name: Rezerva na odmoru
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/rest-reserve.cjs ${{ matrix.browser }}
      - name: Referentni player
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/player-reference.cjs ${{ matrix.browser }}
      - name: Serije koje broje unaprijed
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: node tools/browser/rep-set-timer.cjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: provjere-${{ matrix.browser }}
          path: ${{ env.MT_TEST_OUTPUT }}
          if-no-files-found: ignore
